stages:
  - verify

default:
  tags: ["do-docker-runner"]
  image: node:24
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.9.0 --activate
    - pnpm install --frozen-lockfile

backend-build-and-test:
  stage: verify
  services:
    - name: mysql:8.0
      alias: mysql
      variables:
        MYSQL_DATABASE: ttms_test
        MYSQL_USER: test_user
        MYSQL_PASSWORD: test_pass
        MYSQL_ROOT_PASSWORD: root
  script:
    - cd backend
    - pnpm exec tsc --project tsconfig.build.json
    - |
        echo "NODE_ENV=test" >> .env.test
        echo "DB_HOST=mysql" >> .env.test
        echo "DB_PORT=3306" >> .env.test
        echo "DB_USER=test_user" >> .env.test
        echo "DB_PASSWORD=test_pass" >> .env.test
        echo "DB_NAME=ttms_test" >> .env.test
        echo "COOKIE_SECRET=secret" >> .env.test
        echo "SESSION_ENCRYPTION_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")" >> .env.test
    - |
        for i in $(seq 1 30); do
          (echo > /dev/tcp/mysql/3306) >/dev/null 2>&1 && break
          echo "Waiting for MySQL..."
          sleep 2
        done
    - NODE_ENV=test pnpm exec drizzle-kit push --force
    - pnpm test
  after_script:
    - |
        if [ "$CI_JOB_STATUS" = "failed" ]; then
          echo "Backend test job failed — creating Jira Bug..."
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${JIRA_URL}/rest/api/2/issue/" \
            -u "${JIRA_SERVICE_EMAIL}:${JIRA_SERVICE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"fields\": {
                \"project\": {\"key\": \"TTMS\"},
                \"summary\": \"CI Pipeline Failure: backend-build-and-test on ${CI_COMMIT_BRANCH} [${CI_COMMIT_SHORT_SHA}]\",
                \"description\": \"Automated bug report from GitLab CI/CD pipeline.\\n\\n*Branch:* ${CI_COMMIT_BRANCH}\\n*Commit:* ${CI_COMMIT_SHORT_SHA}\\n*Author:* ${CI_COMMIT_AUTHOR}\\n*Pipeline:* ${CI_PIPELINE_ID}\\n*Job URL:* ${CI_JOB_URL}\",
                \"issuetype\": {\"name\": \"Bug\"},
                \"priority\": {\"name\": \"High\"}
              }
            }"
        fi
  artifacts:
    when: always
    paths:
      - backend/html/
    expire_in: 1 week

frontend-build:
  stage: verify
  script:
    - cd frontend
    - pnpm run build

backend-code-quality:
  stage: verify
  script:
    - cd backend
    - pnpm run lint

frontend-code-quality:
  stage: verify
  script:
    - cd frontend
    - pnpm exec tsc --noEmit