sonar.projectKey=secj3104-ttms
sonar.projectName=SECJ3104-TTMS

sonar.sourceEncoding=UTF-8
sonar.host.url=http://localhost:9000

sonar.modules=backend,frontend

# --- backend ---
backend.sonar.projectName=Backend
backend.sonar.sources=src
backend.sonar.tests=tests
backend.sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**
backend.sonar.typescript.tsconfigPaths=tsconfig.json
backend.sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- frontend ---
frontend.sonar.projectName=Frontend
frontend.sonar.sources=app,components,lib,types
frontend.sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**
frontend.sonar.typescript.tsconfigPaths=tsconfig.json
